[package]
name = "openwebui-chat"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI tool for agents to chat with Open WebUI models, creating persistent web-visible chat records"
readme = "README.md"
repository = "https://github.com/RyderFreeman4Logos/openwebui-skill"
keywords = ["openwebui", "cli", "agent", "llm", "chat"]
categories = ["command-line-utilities"]

[[bin]]
name = "openwebui-chat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dirs = "5"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
